<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los Museos: Aura</title>
<link rel="icon" href="caja.jpg">
<link rel="apple-touch-icon" href="caja.jpg">
<!-- Su propio manifiesto, aparte del de Los Museos: agregado a la pantalla
     de inicio abre en batalla.html y no en la portada del otro juego. La
     tapa por ahora es la misma; cuando Aura tenga la suya, se cambia acá. -->
<link rel="manifest" href="manifest-aura.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0E1014">
<meta name="description" content="Dos equipos, tres contra tres. Cada uno con su poder y su aura.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0E1014; --panel:#171A21; --panel2:#1F232C; --sunk:#0A0C10;
    --line:#2A2F3A; --hair:#39404E;
    --ink:#F2F1ED; --body:#C8CBD3; --dim:#8B909C;
    --brass:#D9A94F; --brass-dim:#8A6B31;
    --alarm:#E86B5E; --patina:#7FB6A4; --aura:#A98CF0;
    --shadow:0 18px 44px #000a;
  }
  *{box-sizing:border-box}
  canvas,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--body);
    font:16px/1.5 "Archivo","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  #app{height:100%;max-width:860px;margin:0 auto;padding:8px 10px 10px;
    display:flex;flex-direction:column;gap:8px}

  header{display:flex;align-items:baseline;gap:9px;flex:none;padding:0 2px}
  header b{font:400 16px/1 "Archivo Black","Archivo",sans-serif;color:var(--ink);
    letter-spacing:-.02em}
  header small{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-left:auto}

  /* ---------- la escena ---------- */
  #escena{position:relative;flex:1 1 auto;min-height:0;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:var(--shadow);background:#0A0C10}
  #c{display:block;width:100%;height:100%}

  /* Las placas de vida, al estilo de las cajas de combate: chaflán de un lado,
     filete de bronce y los números en monoespaciada. Van en HTML y no en el
     lienzo porque el texto chico dibujado en canvas se ve sucio en el celular. */
  .placa{position:absolute;width:min(56%,268px);padding:7px 10px 8px;
    background:linear-gradient(#141821F2,#0D1016F2);
    border:1px solid #3A4152;border-radius:9px;
    box-shadow:0 6px 18px #0009, inset 0 1px 0 #FFFFFF12}
  .placa::after{content:"";position:absolute;inset:2px;border-radius:7px;
    border:1px solid #D9A94F26;pointer-events:none}
  .placa.rival{left:9px;top:9px;border-bottom-right-radius:2px}
  .placa.mio{right:9px;bottom:9px;border-top-left-radius:2px}

  .placa .fila{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
  .placa .nom{font:400 13px/1 "Archivo Black","Archivo",sans-serif;color:var(--ink);
    letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:0 1 auto;max-width:58%}
  .placa .fila{justify-content:space-between}
  .placa .estado{font:500 8px/1.3 "IBM Plex Mono",monospace;letter-spacing:.04em;
    color:var(--brass);text-align:right;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .barra{position:relative;height:9px;background:#05070A;border-radius:5px;
    overflow:hidden;box-shadow:inset 0 1px 2px #000}
  .barra i{display:block;height:100%;border-radius:5px;transition:width .4s ease}
  .barra::after{content:"";position:absolute;inset:0;border-radius:5px;
    background:linear-gradient(#FFFFFF1F,#FFFFFF00 55%);pointer-events:none}
  .vida i{background:linear-gradient(#9AD2BE,#5E9E8C)}
  .placa.poca .vida i{background:linear-gradient(#E8C96A,#B8922F)}
  .placa.nada .vida i{background:linear-gradient(#F08A7C,#C0483E)}
  .aura{height:6px;margin-top:4px}
  .aura i{background:linear-gradient(#C4B0FF,#8A6BE0);box-shadow:0 0 9px #A98CF090}

  .cifras{display:flex;gap:9px;margin-top:5px;
    font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--dim)}
  .cifras b{color:var(--body);font-weight:600}
  .cifras .a b{color:var(--aura)}

  /* el cartelito de «tocá para ver a otro», mientras no hay combate */
  #pista{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;
    text-transform:uppercase;color:#FFFFFF66;background:#0A0C10AA;
    border:1px solid #FFFFFF14;border-radius:20px;padding:6px 11px;
    pointer-events:none;white-space:nowrap}
  @media(max-width:420px){ #pista{display:none} }

  /* ---------- el cajón de abajo ---------- */
  #dialogo{flex:none;min-height:52px;padding:10px 12px;
    background:linear-gradient(var(--panel),#12151C);
    border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:15px;
    box-shadow:inset 0 1px 0 #FFFFFF0D}
  #dialogo em{color:var(--brass);font-style:normal;font-weight:600}

  #menu{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .opt{appearance:none;border:1px solid var(--line);
    background:linear-gradient(var(--panel2),#181C24);
    color:var(--ink);border-radius:11px;padding:13px 10px;cursor:pointer;
    font:600 13px/1 "Archivo",sans-serif;letter-spacing:.07em;text-transform:uppercase;
    box-shadow:inset 0 1px 0 #FFFFFF0D;
    transition:transform .08s,border-color .15s}
  .opt:active{transform:translateY(1px)}
  .opt[disabled]{opacity:.4;cursor:default}
  @media(hover:hover){ .opt:not([disabled]):hover{border-color:var(--brass-dim)} }
  @media(min-width:640px){ #menu{grid-template-columns:repeat(4,1fr)} }
  @media(max-height:560px){ #dialogo{min-height:0;padding:8px 11px;font-size:14px}
    .opt{padding:10px 8px} header b{font-size:14px} }

  [hidden]{display:none!important}

  /* ---------- pantalla de elegir equipo ---------- */
  #pEquipo{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .intro{margin:0;color:var(--body);font-size:14px}
  .intro b{color:var(--brass)}
  .fichas{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;gap:8px;
    grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    align-content:start;                 /* que cada ficha mida lo que mide */
    padding:2px;-webkit-overflow-scrolling:touch}
  .ficha{appearance:none;cursor:pointer;text-align:center;padding:6px 4px 8px;
    background:linear-gradient(var(--panel2),#181C24);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:border-color .15s,transform .08s}
  .ficha:active{transform:translateY(1px)}
  .ficha canvas{width:72px;height:92px;display:block}
  .ficha b{font:400 12px/1.1 "Archivo Black","Archivo",sans-serif;letter-spacing:-.01em}
  .ficha small{font:500 8px/1.3 "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.04em}
  .ficha.elegida{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass-dim) inset,0 8px 20px #0008}
  .ficha.elegida b{color:var(--brass)}

  .btnGrande{flex:none;appearance:none;cursor:pointer;width:100%;
    background:linear-gradient(#2A2F3B,#1C212B);color:var(--ink);
    border:1px solid var(--brass-dim);border-radius:12px;padding:14px;
    font:600 14px/1 "Archivo",sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .btnGrande[disabled]{opacity:.45;cursor:default;border-color:var(--line)}

  /* ---------- la batalla ---------- */
  #pBatalla{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}

  /* el marcador: tres puntos por equipo, y se apagan al caer */
  .vidas{display:inline-flex;gap:4px;vertical-align:middle}
  .vidas i{width:7px;height:7px;border-radius:50%;background:var(--patina);
    box-shadow:0 0 6px #7FB6A466;transition:background .3s,box-shadow .3s}
  .vidas.ellos i{background:var(--alarm);box-shadow:0 0 6px #E86B5E66}
  .vidas i.ido{background:#333945;box-shadow:none}

  #submenu{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  @media(min-width:640px){ #submenu{grid-template-columns:repeat(4,1fr)} }
  .opt small{display:block;margin-top:4px;font:500 8px/1.2 "IBM Plex Mono",monospace;
    letter-spacing:.04em;text-transform:none;color:var(--dim)}
  .opt small.a{color:var(--aura)}
  .opt.volver{border-style:dashed}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Los Museos: Aura</b>
    <span class="vidas" id="tuyos"></span>
    <small id="ronda">Elegí tu equipo</small>
    <span class="vidas ellos" id="suyos"></span>
  </header>

  <section id="pEquipo">
    <p class="intro">Elegí <b>tres</b>. El otro equipo manda tres de los suyos.</p>
    <div class="fichas" id="fichas"></div>
    <button class="btnGrande" id="btnEmpezar" disabled>Elegí tres</button>
  </section>

  <section id="pBatalla" hidden>
    <div id="escena">
      <canvas id="c"></canvas>
      <div class="placa rival" id="placaRival">
        <div class="fila"><span class="nom">—</span><span class="estado"></span></div>
        <div class="barra vida"><i style="width:100%"></i></div>
        <div class="barra aura"><i style="width:0%"></i></div>
        <div class="cifras"><span><b>—</b> vida</span><span class="a"><b>—</b> aura</span></div>
      </div>
      <div class="placa mio" id="placaMio">
        <div class="fila"><span class="nom">—</span><span class="estado"></span></div>
        <div class="barra vida"><i style="width:100%"></i></div>
        <div class="barra aura"><i style="width:0%"></i></div>
        <div class="cifras"><span><b>—</b> vida</span><span class="a"><b>—</b> aura</span></div>
      </div>
    </div>

    <div id="dialogo">—</div>

    <div id="menu">
      <button class="opt" id="optPelear">Pelear</button>
      <button class="opt" id="optPoder">Poder</button>
      <button class="opt" id="optMochila">Mochila</button>
      <button class="opt" id="optCambiar">Cambiar</button>
    </div>
    <div id="submenu" hidden></div>
  </section>
</div>

<script>
/* =====================================================================
   Los Museos: Aura · dos equipos, tres contra tres.

   Juego aparte del de sigilo. index.html no se toca y este archivo no lo
   lee: lo único que comparten son los personajes —quién es quién, de qué
   color anda— y ni siquiera el dibujo.

   El dibujo es nuevo a propósito. El del tablero está hecho para verse de
   un centímetro entre las paredes de una sala: cuatro rectángulos y dos
   puntos por ojo, y de cerca se nota. Acá el mismo tipo ocupa un tercio de
   la pantalla, así que tiene cuerpo, sombra propia, cara con expresión y
   pelo con volumen. Las medidas también cambian: allá la persona mide 30
   unidades, acá mide 100, con los pies apoyando en 0.
   ===================================================================== */

/* ---------- quién es quién ----------
   Los diez del museo. Son los mismos de siempre: el pelo, la remera y el
   nombre estampado vienen de ahí, que es lo que los hace reconocibles. */
const CREW = {
  tomy  :{n:"Tomy",      hair:"#C2571F", style:"rulos",      beard:false, tall:1.00, shirt:"#4E8FD0"},
  lamber:{n:"Lamber",    hair:"#1E1A18", style:"corto",      beard:true,  tall:1.00, shirt:"#57A06B"},
  chupa :{n:"Chupa",     hair:"#1E1A18", style:"corto",      beard:false, tall:1.00, shirt:"#C9603F"},
  kzk   :{n:"Kzk",       hair:"#A9793F", style:"corto",      beard:true,  tall:1.00, shirt:"#8A6BC4"},
  matxi :{n:"Matxi",     hair:"#6B4526", style:"corto",      beard:false, tall:1.00, shirt:"#D8A33C"},
  chuna :{n:"Chuna",     hair:"#3A2416", style:"largorulos", beard:false, tall:1.00, shirt:"#3FA6A0"},
  hippie:{n:"El Hippie", hair:"#1E1A18", style:"corto",      beard:false, tall:1.18, shirt:"#22242A"},
  marian:{n:"Marian",    hair:"#7A5230", style:"largo",      beard:false, tall:1.10, shirt:"#5B7FD4"},
  damian:{n:"Damián",    hair:"#1E1A18", style:"medio",      beard:false, tall:1.00, shirt:"#7FA23E"},
  negro :{n:"El Negro",  hair:"#2A1D14", style:"corto",      beard:true,  tall:1.00, shirt:"#6B4A2F", skin:"#8A5A38"},
};

/* El otro equipo: nueve, y los nombres los pone el autor. Mientras tanto
   quedan las pintas armadas para poder mirar la pantalla. Cuando lleguen
   los nombres se reemplaza este bloque y nada más que este bloque. */
const OTROS = {
  otro1:{n:"Rival 1", hair:"#3A2416", style:"medio",      beard:false, tall:1.00, shirt:"#C4506B"},
  otro2:{n:"Rival 2", hair:"#1E1A18", style:"corto",      beard:true,  tall:1.06, shirt:"#3E7FA0"},
  otro3:{n:"Rival 3", hair:"#A9793F", style:"largo",      beard:false, tall:1.00, shirt:"#6BA04F"},
  otro4:{n:"Rival 4", hair:"#C2571F", style:"corto",      beard:false, tall:1.00, shirt:"#8A5AB8"},
  otro5:{n:"Rival 5", hair:"#2A1D14", style:"largorulos", beard:false, tall:1.00, shirt:"#D8B33C", skin:"#8A5A38"},
  otro6:{n:"Rival 6", hair:"#6B4526", style:"rulos",      beard:true,  tall:1.00, shirt:"#4E5A70"},
  otro7:{n:"Rival 7", hair:"#1E1A18", style:"corto",      beard:false, tall:1.14, shirt:"#B8563E"},
  otro8:{n:"Rival 8", hair:"#7A5230", style:"medio",      beard:false, tall:1.00, shirt:"#2FA88C"},
  otro9:{n:"Rival 9", hair:"#1E1A18", style:"corto",      beard:true,  tall:1.00, shirt:"#A0863E"},
};
for(const c of Object.values(CREW))  c.tag = c.n.replace(/^El /,"").toUpperCase();
for(const c of Object.values(OTROS)) c.tag = c.n.toUpperCase();

const MIOS  = Object.values(CREW);
const SUYOS = Object.values(OTROS);

/* ---------- color ----------
   Todo el sombreado sale de mezclar el color propio con blanco o con el
   negro del fondo. Así ninguna sombra se va de la paleta del juego. */
function rgbDe(h){
  const n = parseInt(h.slice(1),16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function mezcla(a, b, t){
  const x = rgbDe(a), y = rgbDe(b);
  const c = k => Math.round(x[k] + (y[k]-x[k])*t);
  return "rgb(" + c(0) + "," + c(1) + "," + c(2) + ")";
}
const aclarar  = (h,k) => mezcla(h, "#FFFFFF", k);
const oscurecer = (h,k) => mezcla(h, "#090B10", k);
function rgba(h, a){
  const c = rgbDe(h);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}
const rr = (g,x,y,w,h,r) => { g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
/* el degradé de siempre: luz arriba a la izquierda, sombra abajo a la derecha */
function luz(g, x0,y0,x1,y1, c, kl, kd){
  const gr = g.createLinearGradient(x0,y0,x1,y1);
  gr.addColorStop(0, aclarar(c,kl)); gr.addColorStop(1, oscurecer(c,kd));
  return gr;
}
/* ¿la remera es oscura? decide de qué color va el nombre estampado */
function esOscuro(hex){
  const c = rgbDe(hex);
  return (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) < 140;
}

/* =====================================================================
   LA GENTE
   Mide 100 de alto con los pies en 0. La cabeza es un óvalo de 15.5 × 16.5
   centrado en -83, los hombros están en -66 y la cadera en -36.
   `bob` es la respiración: mueve el torso y la cabeza, nunca los pies.
   ===================================================================== */
const PANTALON = "#2B3140", ZAPATO = "#191C23";

function pierna(g, x, pant){
  g.fillStyle = luz(g, x-5.6,-38, x+5.6,-6, pant, .12, .30);
  rr(g, x-5.6, -38, 11.2, 33, 3.8); g.fill();
  g.strokeStyle = oscurecer(pant,.45); g.lineWidth = 1.1; g.stroke();
  g.fillStyle = rgba("#FFFFFF", .05); rr(g, x-4.6, -37, 3.2, 30, 1.6); g.fill(); // pliegue
  g.fillStyle = luz(g, x-7,-8, x+7,0, ZAPATO, .22, .22);                        // zapato
  rr(g, x-7, -8, 14, 8, 2.9); g.fill();
  g.strokeStyle = oscurecer(ZAPATO,.5); g.stroke();
  g.fillStyle = aclarar(ZAPATO,.3); rr(g, x-7, -2.6, 14, 2.6, 1.3); g.fill();   // suela
}

function brazo(g, lado, bob, piel, col){
  /* Nace en la costura del hombro y se superpone al torso: si arranca más
     abajo o más afuera, el brazo se lee como una pastilla suelta al lado
     del cuerpo. La manga tapa la unión, que es lo que la disimula. */
  g.save();
  g.translate(lado*15.6, -66.5+bob);
  g.rotate(lado * 0.055);
  g.fillStyle = luz(g, -5.4,0, 5.4,15, col, .10, .30);                          // manga
  rr(g, -5.4, -1.5, 10.8, 16, 4.6); g.fill();
  g.strokeStyle = oscurecer(col,.48); g.lineWidth = 1.1; g.stroke();
  g.fillStyle = luz(g, -4.4,13, 4.4,30, piel, .10, .26);                        // antebrazo
  rr(g, -4.4, 12.5, 8.8, 19, 3.8); g.fill();
  g.strokeStyle = oscurecer(piel,.4); g.stroke();
  g.fillStyle = luz(g, -4.8,29, 4.8,38, piel, .14, .24);                        // mano
  g.beginPath(); g.ellipse(0, 33.5, 4.9, 5.4, 0, 0, 7); g.fill();
  g.strokeStyle = oscurecer(piel,.42); g.stroke();
  g.restore();
}

function torso(g, bob, col, espalda, tag){
  const y0 = -67+bob, y1 = -35+bob;
  g.beginPath();
  g.moveTo(-17.5, y0+5);
  g.quadraticCurveTo(-17.5, y0-1.5, -11, y0-2.5);
  g.lineTo(11, y0-2.5);
  g.quadraticCurveTo(17.5, y0-1.5, 17.5, y0+5);
  g.lineTo(13, y1);
  g.quadraticCurveTo(0, y1+3.2, -13, y1);
  g.closePath();
  g.fillStyle = luz(g, -17,y0, 17,y1, col, .15, .28); g.fill();
  g.strokeStyle = oscurecer(col,.5); g.lineWidth = 1.2; g.stroke();

  if(espalda){
    g.strokeStyle = rgba("#000000", .16); g.lineWidth = 1;                      // costura del hombro
    g.beginPath(); g.moveTo(-14.5, y0+4); g.lineTo(14.5, y0+4); g.stroke();
  }else{
    g.fillStyle = oscurecer(col,.34);                                           // cuello redondo
    g.beginPath(); g.ellipse(0, y0-1.5, 6.4, 3.4, 0, 0, Math.PI); g.fill();
  }
  g.fillStyle = rgba("#FFFFFF", .06);                                           // brillo del pecho
  rr(g, -12, y0+3, 7, 22, 3); g.fill();

  if(tag){                                                                      // el nombre estampado
    g.save();
    g.textAlign = "center"; g.textBaseline = "middle";
    let px = 9;
    g.font = '700 ' + px + 'px "Archivo",system-ui,sans-serif';
    const an = g.measureText(tag).width;
    /* entre los dos brazos quedan 20 de remera a la vista: si el nombre no
       entra, se achica la letra. Con «El Negro» o «Damián» hace falta. */
    if(an > 18){ px = Math.max(4.6, px*18/an); g.font = '700 ' + px.toFixed(2) + 'px "Archivo",system-ui,sans-serif'; }
    g.fillStyle = esOscuro(col) ? "rgba(242,241,237,.92)" : "rgba(18,20,26,.82)";
    g.fillText(tag, 0, y0+16);
    g.restore();
  }
}

/* ---------- las caras ----------
   Ojos con blanco, iris y un brillo; cejas en el color del pelo; nariz y
   boca apenas sugeridas. Con eso alcanza para que a esta escala se lea
   una persona y no un muñeco. */
/* De un nombre sale siempre el mismo número, así que la cara de cada uno no
   cambia entre partidas ni entre teléfonos. */
function semillaDe(nombre){
  let h = 0;
  for(let i = 0; i < nombre.length; i++) h = (h*31 + nombre.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function cara(g, bob, piel, pelo, parp, sem){
  const cy = -83+bob;
  const sep  = 5.8 + (sem % 3) * 0.5;                    // ojos más juntos o más separados
  const ojo  = 3.3 + ((sem >> 2) % 3) * 0.28;            // ojos más chicos o más grandes
  const ceja = ((sem >> 4) % 3 - 1) * 1.1;               // cejas rectas, altas o caídas
  const boca = 2.0 + ((sem >> 6) % 4) * 0.85;            // más o menos sonrisa
  const anchoBoca = 3.0 + ((sem >> 8) % 3) * 0.6;
  g.save();
  g.strokeStyle = oscurecer(pelo, .1); g.lineWidth = 1.7; g.lineCap = "round";
  g.beginPath(); g.moveTo(-sep-3, cy-6.6+ceja); g.lineTo(-sep+2.6, cy-7.6-ceja); // cejas
  g.moveTo(sep+3, cy-6.6+ceja); g.lineTo(sep-2.6, cy-7.6-ceja); g.stroke();

  if(parp){
    g.strokeStyle = "#3A3028"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-sep-2.8, cy-1.6); g.quadraticCurveTo(-sep, cy+.8, -sep+2.8, cy-1.6);
    g.moveTo(sep+2.8, cy-1.6); g.quadraticCurveTo(sep, cy+.8, sep-2.8, cy-1.6); g.stroke();
  }else{
    for(const s of [-1, 1]){
      g.fillStyle = "#F7F4EE";
      g.beginPath(); g.ellipse(s*sep, cy-1.4, ojo, ojo*1.12, 0, 0, 7); g.fill();
      g.fillStyle = "#2A2118";
      g.beginPath(); g.ellipse(s*sep+s*0.5, cy-1.2, ojo*0.6, ojo*0.75, 0, 0, 7); g.fill();
      g.fillStyle = "rgba(255,255,255,.85)";
      g.beginPath(); g.arc(s*sep-0.8, cy-2.6, .85, 0, 7); g.fill();
    }
  }
  g.strokeStyle = oscurecer(piel, .3); g.lineWidth = 1.3;                        // nariz
  g.beginPath(); g.moveTo(-.6, cy+2.6); g.quadraticCurveTo(1.4, cy+4.4, -.8, cy+5); g.stroke();
  g.strokeStyle = "rgba(120,70,60,.65)"; g.lineWidth = 1.5;                      // boca
  g.beginPath(); g.moveTo(-anchoBoca, cy+8.4);
  g.quadraticCurveTo(0, cy+8.4+boca, anchoBoca, cy+8.4); g.stroke();
  g.restore();
}

/* ---------- el pelo ----------
   Los mismos cinco cortes del juego de tablero, con volumen: una masa de
   base, un brillo arriba y el contorno un tono más oscuro. El pelo que va
   detrás de la cabeza (melenas) se dibuja antes que el cuerpo. */
function peloAtras(g, look, bob, espalda){
  const cy = -83+bob, pelo = look.hair, e = look.style;
  if(e !== "largo" && e !== "largorulos" && e !== "medio" && !espalda) return;
  g.fillStyle = luz(g, -18,cy-16, 18,cy+22, pelo, .10, .30);
  if(e === "largo"){
    g.beginPath(); g.moveTo(-16.5, cy-4);
    g.quadraticCurveTo(-19, cy+18, -13, cy+22);
    g.lineTo(13, cy+22);
    g.quadraticCurveTo(19, cy+18, 16.5, cy-4);
    g.closePath(); g.fill();
  }else if(e === "largorulos"){
    for(const [x,y,r] of [[-15,cy+4,8],[15,cy+4,8],[-15.5,cy+13,7.4],[15.5,cy+13,7.4],
                          [-9,cy+20,7],[9,cy+20,7],[0,cy+21,7.4]]){
      g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
  }else{
    g.beginPath(); g.ellipse(0, cy+1, 17.4, 18.6, 0, 0, 7); g.fill();
  }
}

function peloAdelante(g, look, bob, espalda){
  const cy = -83+bob, pelo = look.hair, e = look.style;
  g.save();
  g.fillStyle = luz(g, -16,cy-19, 14,cy+8, pelo, .17, .20);
  g.strokeStyle = oscurecer(pelo, .42); g.lineWidth = 1.1; g.lineJoin = "round";

  if(espalda){
    /* de espaldas es una sola masa que tapa casi toda la cabeza */
    /* tapa la cabeza entera y un poco más: si queda corta, abajo asoma la
       piel del cráneo y de lejos parece una cara dada vuelta. */
    g.beginPath(); g.ellipse(0, cy-0.5, 16.8, 18.2, 0, 0, 7); g.fill(); g.stroke();
    if(e === "rulos" || e === "largorulos"){
      for(const [x,y,r] of [[-9,cy-11,6.2],[0,cy-14,6.8],[9,cy-11,6.2],
                            [-13.5,cy-3,5.6],[13.5,cy-3,5.6]]){
        g.beginPath(); g.arc(x,y,r,0,7); g.fill();
      }
    }
    g.fillStyle = rgba("#FFFFFF", .13);
    g.beginPath(); g.ellipse(-5.5, cy-9, 5.8, 3.4, -0.5, 0, 7); g.fill();
    /* la nuca: el pelo baja en punta sobre el cuello. Sin esto la cabeza de
       atrás es un huevo liso y no se entiende qué se está mirando. */
    g.fillStyle = oscurecer(pelo, .26);
    g.beginPath();
    g.moveTo(-8.4, cy+13);
    g.quadraticCurveTo(0, cy+21, 8.4, cy+13);
    g.quadraticCurveTo(0, cy+15.5, -8.4, cy+13);
    g.closePath(); g.fill();
    g.restore(); return;
  }

  if(e === "rulos" || e === "largorulos"){
    /* los rulos sí son piezas: es lo que los hace rulos. Se rellenan todos
       primero y recién después va el contorno, así no quedan las costuras
       de un rulo cruzando por encima del de al lado. */
    const bollos = [[-9.5,cy-11,6.6],[0,cy-14.8,7.2],[9.5,cy-11,6.6],
                    [-14,cy-3.5,5.8],[14,cy-3.5,5.8]];
    for(const [x,y,r] of bollos){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  }else{
    /* corto, medio y largo son la misma silueta con los costados más o menos
       largos: una sola tirada, del filo de un lado al del otro, y el
       flequillo cruzado de vuelta. */
    const hasta = e === "largo" ? cy+17 : e === "medio" ? cy+7 : cy-2;
    g.beginPath();
    g.moveTo(-17, hasta);
    g.quadraticCurveTo(-18.6, cy-16, 0, cy-18.2);
    g.quadraticCurveTo(18.6, cy-16, 17, hasta);
    g.lineTo(12.6, hasta);
    g.quadraticCurveTo(13.8, cy-8.5, 4, cy-10);
    g.quadraticCurveTo(-7, cy-11, -12.6, cy-2.5);
    g.lineTo(-12.6, hasta);
    g.closePath();
    g.fill(); g.stroke();
  }
  g.fillStyle = rgba("#FFFFFF", .15);                                           // brillo
  g.beginPath(); g.ellipse(-6, cy-12.5, 6.4, 2.8, -0.4, 0, 7); g.fill();
  g.restore();
}

function dibujarPersona(g, look, o){
  o = o || {};
  const bob = o.bob || 0, espalda = !!o.espalda, t = look.tall || 1;
  const piel = look.skin || "#EFC08C", pelo = look.hair, col = look.shirt;
  const cy = -83+bob;

  g.save();
  g.lineJoin = "round"; g.lineCap = "round";
  /* el que cayó se ve caído: se apaga, se hunde y queda torcido. Sin esto,
     al final de la pelea el último que perdió sigue parado como si nada. */
  if(o.caido){
    g.globalAlpha = 0.42;
    g.translate(0, 8); g.rotate(-0.13);
  }
  g.scale(1, t);

  g.fillStyle = "rgba(0,0,0,.36)";                                              // sombra en el piso
  g.beginPath(); g.ellipse(0, 1.5, 25, 6.8, 0, 0, 7); g.fill();

  pierna(g, -11, PANTALON); pierna(g, 11, PANTALON);
  peloAtras(g, look, bob, espalda);

  g.fillStyle = oscurecer(piel, .22);                                           // cuello
  rr(g, -5.2, cy+12, 10.4, 10, 2.8); g.fill();

  torso(g, bob, col, espalda, espalda ? look.tag : look.tag);

  const orejas = () => {
    for(const s of [-1, 1]){
      g.fillStyle = luz(g, s*14,cy-4, s*20,cy+5, piel, .06, .28);
      g.beginPath(); g.ellipse(s*15.2, cy+0.5, 3.2, 4.6, 0, 0, 7); g.fill();
      g.strokeStyle = oscurecer(piel,.4); g.lineWidth = 1; g.stroke();
    }
  };
  /* De atrás no se ve la oreja: se ve el filo de afuera y nada más, porque
     el pelo tapa el resto. Por eso va ANTES del pelo y no después —dibujada
     encima quedaba pegoteada sobre la nuca, como dos manijas— y por eso es
     más chica, más abajo y apenas inclinada hacia afuera. Al que tiene
     melena no le asoma nada, que es lo que corresponde. */
  const orejasDeAtras = () => {
    for(const s of [-1, 1]){
      g.save();
      g.translate(s*15.4, cy+2.2); g.rotate(s*0.14);
      g.fillStyle = luz(g, -3,-4, 3,4, piel, .02, .34);
      g.beginPath(); g.ellipse(0, 0, 2.9, 4.2, 0, 0, 7); g.fill();
      g.strokeStyle = oscurecer(piel, .46); g.lineWidth = .9; g.stroke();
      g.restore();
    }
  };
  if(!espalda) orejas();
  g.fillStyle = luz(g, -14,cy-16, 12,cy+14, piel, .14, .20);                    // cabeza
  g.beginPath(); g.ellipse(0, cy, 15.5, 16.5, 0, 0, 7); g.fill();
  g.strokeStyle = oscurecer(piel, .42); g.lineWidth = 1.2; g.stroke();

  if(!espalda){
    cara(g, bob, piel, pelo, !!o.parp, semillaDe(look.n));
    if(look.beard){
      g.fillStyle = luz(g, -10,cy+2, 10,cy+14, pelo, .08, .26);
      g.beginPath(); g.moveTo(-11.5, cy+2);
      g.quadraticCurveTo(-10, cy+15, 0, cy+15.8);
      g.quadraticCurveTo(10, cy+15, 11.5, cy+2);
      g.quadraticCurveTo(6, cy+9, 0, cy+9.2);
      g.quadraticCurveTo(-6, cy+9, -11.5, cy+2);
      g.closePath(); g.fill();
    }
  }
  if(espalda) orejasDeAtras();             // antes del pelo: que las tape él
  peloAdelante(g, look, bob, espalda);
  brazo(g, -1, bob, piel, col); brazo(g, 1, bob, piel, col);
  g.restore();
}

/* =====================================================================
   LA ESCENA
   Un salón con fondo, piso en perspectiva, dos tarimas y polvo en el aire.
   Lo que no se mueve se dibuja una vez en un lienzo aparte y se estampa en
   cada cuadro: en el celular, redibujar los degradés sesenta veces por
   segundo se nota en la batería.
   ===================================================================== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let ancho = 0, alto = 0, fondo = null;
const HOR = 0.46;                                   // dónde termina la pared

function cuadro(g, x, y, an, al, semilla){
  g.save();
  g.fillStyle = "#0A0B0F"; g.fillRect(x-3, y-3, an+6, al+6);                    // marco
  const m = g.createLinearGradient(x-3, y-3, x+an+3, y+al+3);
  m.addColorStop(0, "#E0B564"); m.addColorStop(.5, "#8A6B31"); m.addColorStop(1, "#C79B4A");
  g.strokeStyle = m; g.lineWidth = 2.6; g.strokeRect(x-2.2, y-2.2, an+4.4, al+4.4);
  /* la tela: bloques de color, que de lejos es exactamente lo que se ve de
     un cuadro y no distrae de los que pelean */
  const tonos = [["#2E4A6E","#7FB6A4"],["#5A2E3E","#D9A94F"],["#2E3E2A","#C8A45E"]][semilla % 3];
  const f = g.createLinearGradient(x, y, x+an, y+al);
  f.addColorStop(0, tonos[0]); f.addColorStop(1, oscurecer(tonos[0], .5));
  g.fillStyle = f; g.fillRect(x, y, an, al);
  g.fillStyle = rgba(tonos[1], .5);
  g.beginPath(); g.arc(x+an*0.62, y+al*0.36, an*0.2, 0, 7); g.fill();
  g.fillStyle = rgba(tonos[1], .22);
  g.fillRect(x, y+al*0.66, an, al*0.34);
  g.fillStyle = "rgba(255,255,255,.07)";                                        // reflejo del vidrio
  g.beginPath(); g.moveTo(x, y+al); g.lineTo(x+an*0.5, y); g.lineTo(x+an*0.78, y);
  g.lineTo(x+an*0.28, y+al); g.closePath(); g.fill();
  g.restore();
}

function foco(g, x, yTecho, yPiso, radio){
  g.save();
  const cono = g.createLinearGradient(x, yTecho, x, yPiso);
  cono.addColorStop(0, "rgba(217,169,79,.16)");
  cono.addColorStop(1, "rgba(217,169,79,0)");
  g.fillStyle = cono;
  g.beginPath(); g.moveTo(x-7, yTecho); g.lineTo(x+7, yTecho);
  g.lineTo(x+radio, yPiso); g.lineTo(x-radio, yPiso); g.closePath(); g.fill();
  g.fillStyle = "#1A1E27";                                                      // el artefacto
  rr(g, x-7, yTecho-7, 14, 8, 2); g.fill();
  g.fillStyle = "#F0D79A";
  g.beginPath(); g.ellipse(x, yTecho+1, 5, 2.2, 0, 0, 7); g.fill();
  g.restore();
}

function construirFondo(){
  const f = document.createElement("canvas");
  f.width = ancho; f.height = alto;
  const g = f.getContext("2d");
  const hy = alto*HOR;

  const pared = g.createLinearGradient(0, 0, 0, hy);                            // pared
  pared.addColorStop(0, "#191D27"); pared.addColorStop(1, "#10131A");
  g.fillStyle = pared; g.fillRect(0, 0, ancho, hy);

  const piso = g.createLinearGradient(0, hy, 0, alto);                          // piso
  piso.addColorStop(0, "#232834"); piso.addColorStop(.55, "#161A22"); piso.addColorStop(1, "#0B0D12");
  g.fillStyle = piso; g.fillRect(0, hy, ancho, alto-hy);

  /* las juntas del piso, abriéndose hacia abajo: es lo único que hace falta
     para que el piso se lea como piso y no como una franja de color */
  g.strokeStyle = "rgba(255,255,255,.05)"; g.lineWidth = 1;
  for(let i = -6; i <= 6; i++){
    g.beginPath(); g.moveTo(ancho/2 + i*ancho*0.055, hy);
    g.lineTo(ancho/2 + i*ancho*0.30, alto); g.stroke();
  }
  for(let k = 1; k <= 7; k++){
    const y = hy + (alto-hy) * Math.pow(k/7, 1.9);
    g.beginPath(); g.moveTo(0, y); g.lineTo(ancho, y); g.stroke();
  }

  const angosto = ancho < 520;
  const cuadros = angosto ? [[0.21,0.30],[0.80,0.26]]
                          : [[0.13,0.28],[0.50,0.20],[0.86,0.30]];
  cuadros.forEach(([fx, fy], i) => {
    const an = Math.max(24, Math.min(ancho*0.10, hy*0.34)), al = an*1.25;
    cuadro(g, ancho*fx - an/2, hy*fy, an, al, i);
  });

  g.strokeStyle = "#2A2F3A"; g.lineWidth = 1;                                   // zócalo
  g.beginPath(); g.moveTo(0, hy+.5); g.lineTo(ancho, hy+.5); g.stroke();
  g.fillStyle = "rgba(217,169,79,.07)"; g.fillRect(0, hy-7, ancho, 7);

  foco(g, ancho*0.74, 6, alto*0.62, ancho*0.16);                                // los dos focos
  foco(g, ancho*0.27, 6, alto, ancho*0.24);

  const v = g.createRadialGradient(ancho/2, alto/2, Math.min(ancho,alto)*0.28,
                                   ancho/2, alto/2, Math.max(ancho,alto)*0.78);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.62)");
  g.fillStyle = v; g.fillRect(0, 0, ancho, alto);
  fondo = f;
}

function tarima(g, x, y, radio, tinte){
  g.save();
  g.fillStyle = "rgba(0,0,0,.28)";                                              // sombra abajo
  g.beginPath(); g.ellipse(x, y+radio*0.10, radio*1.06, radio*0.30, 0, 0, 7); g.fill();
  const p = g.createLinearGradient(x-radio, y-radio*0.3, x+radio, y+radio*0.3);
  p.addColorStop(0, "#2C323F"); p.addColorStop(.5, "#1D222C"); p.addColorStop(1, "#141821");
  g.fillStyle = p;
  g.beginPath(); g.ellipse(x, y, radio, radio*0.28, 0, 0, 7); g.fill();
  g.strokeStyle = rgba(tinte, .5); g.lineWidth = 1.6;
  g.beginPath(); g.ellipse(x, y, radio, radio*0.28, 0, 0, 7); g.stroke();
  g.strokeStyle = rgba(tinte, .16); g.lineWidth = 1;
  g.beginPath(); g.ellipse(x, y, radio*0.7, radio*0.19, 0, 0, 7); g.stroke();
  g.restore();
}

/* el polvo en el aire: doce motas que suben despacio y vuelven a empezar */
let motas = [];
function armarMotas(){
  motas = [];
  for(let i = 0; i < 12; i++){
    motas.push({x:Math.random()*ancho, y:Math.random()*alto,
                r:0.7+Math.random()*1.5, v:2+Math.random()*7, a:0.05+Math.random()*0.13});
  }
}
function dibujarMotas(g, dt){
  g.save();
  for(const m of motas){
    m.y -= m.v*dt/1000;
    if(m.y < -4){ m.y = alto+4; m.x = Math.random()*ancho; }
    g.fillStyle = "rgba(230,215,180," + m.a + ")";
    g.beginPath(); g.arc(m.x, m.y, m.r, 0, 7); g.fill();
  }
  g.restore();
}

function medir(){
  const caja = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  ancho = Math.max(1, Math.round(caja.width));
  alto  = Math.max(1, Math.round(caja.height));
  cv.width = Math.round(ancho*dpr); cv.height = Math.round(alto*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  construirFondo(); armarMotas();
}
let medida = "";
function medirSiHaceFalta(){
  const caja = cv.parentElement.getBoundingClientRect();
  const clave = Math.round(caja.width)+"x"+Math.round(caja.height)+"@"+(window.devicePixelRatio||1);
  if(clave === medida) return;
  medida = clave; medir();
}
window.addEventListener("resize", medirSiHaceFalta);

/* Dónde va cada uno. El que juega va grande abajo a la izquierda y de
   espaldas, como en cualquier combate por turnos; el rival, más chico y
   más atrás, mirando de frente. La escala la manda el alto del salón, y
   el ancho la corrige para que apaisado no se toquen. */
function puestos(){
  const u = Math.max(0.9, Math.min(alto/330, ancho/235, 2.4));
  return {
    rival: {x: ancho*0.735, y: alto*0.605, u: u*0.78},
    mio:   {x: ancho*0.265, y: alto*0.935, u: u},
  };
}

/* =====================================================================
   EL MOTOR
   Esta parte no toca el DOM a propósito: así el mismo código corre en node
   para jugar miles de batallas solas y mirar el balance. Todo el azar pasa
   por AZAR, que el arnés reemplaza por uno con semilla fija.
   ===================================================================== */
let AZAR = Math.random;

/* Cada uno pelea distinto. Son cuatro números y alcanzan: vida, lo que pega,

const PERFILES = {

  lamber:{v:142, at:10, df:13, vel:8,  ap:5},   // aguanta todo, llega tarde
  chupa :{v:112, at:14, df:9,  vel:12, ap:6},   // pega fuerte y se come todo
  kzk   :{v:124, at:10, df:14, vel:9,  ap:6},   // el que no se rompe
  matxi :{v:138, at:11, df:12, vel:8,  ap:5},   // cara de piedra
  chuna :{v:106, at:12, df:9,  vel:15, ap:7},   // piernas: siempre primero
  hippie:{v:118, at:10, df:10, vel:13, ap:9},   // aura pura
  marian:{v:120, at:12, df:11, vel:11, ap:7},

/* Los nueve del otro equipo, mientras no tengan nombre, reparten los mismos

const PERFILES_OTROS = {

  otro3:{v:112, at:13, df:9,  vel:13, ap:7}, otro4:{v:126, at:11, df:12, vel:10, ap:6},
  otro5:{v:132, at:12, df:11, vel:9,  ap:6}, otro6:{v:108, at:14, df:9,  vel:12, ap:5},
  otro7:{v:136, at:11, df:12, vel:8,  ap:7}, otro8:{v:116, at:11, df:10, vel:14, ap:8},
  otro9:{v:122, at:13, df:10, vel:10, ap:6},
};
function perfilDe(clave){ return PERFILES[clave] || PERFILES_OTROS[clave]; }

/* Los tres golpes y la cuarta opción, que es no pegar y juntar aura. El
   canje es siempre el mismo: cuanto más daño hace, menos aura deja. */
const GOLPES = [
  {id:"seco",    n:"Golpe seco",  poder:22, punteria:1.00, aura:6,  pie:"seguro"},
  {id:"volada",  n:"Volada",      poder:40, punteria:0.70, aura:4,  pie:"fuerte, falla"},
  {id:"chupar",  n:"Chupar aura", poder:11, punteria:0.95, aura:15, roba:10, pie:"roba aura"},
];
const CONCENTRAR = {id:"concentrar", n:"Concentrarse", aura:26, guardia:1.45,
                    pie:"+26 aura, te cubrís"};
const golpeDe = id => GOLPES.find(g => g.id === id);

/* ---------- los poderes ----------
   Uno por cabeza, salvo Chupa que tiene dos. Acá está la razón de juntar
   aura: cada poder cuesta, y el que no la gasta la junta al pedo.

   Los que escribió el autor van tal cual. Los cuatro que faltaban —Tomy,
   El Hippie, Marian y El Negro— están inventados en esa misma línea y son
   para cambiar; lo mismo los nueve del otro equipo, que son provisorios
   hasta que tengan nombre.

   `hace` recibe al que lo usa y al rival, y toca números y nada más: si
   alguno mete algo del navegador acá, el arnés deja de correr y se pierde
   la única forma de probar el balance. */

function enamorar(p){ p.enamorado = true; }

function poderesDe(clave){ return PODERES[clave] || PODERES_OTROS[clave] || []; }

function armarPeleador(clave, look){
  const p = perfilDe(clave);
  return {clave, look, n:look.n,
          vida:p.v, vidaMax:p.v, aura:0, auraMax:100,
          ataque:p.at, defensa:p.df, velocidad:p.vel, auraPorRonda:p.ap,
          guardia:1, caido:false,
          poderes: poderesDe(clave),
          /* los estados: dormido cuenta turnos, los otros dos son sí o no */
          dormido:0, confundido:false, enamorado:false, noFalla:0,
          mods:{ataque:1, defensa:1, velocidad:1, punteria:1, evasion:0, auraExtra:0}};
}

function nuevaBatalla(clavesMias, clavesSuyas){
  return {
    ronda: 1,
    a: {equipo: clavesMias.map(k  => armarPeleador(k, CREW[k])),  i:0, humano:true},
    b: {equipo: clavesSuyas.map(k => armarPeleador(k, OTROS[k])), i:0, humano:false},
    fin: null,
  };
}
const activo   = (est, l) => est[l].equipo[est[l].i];
const enPie    = lado => lado.equipo.filter(p => !p.caido);
const otroLado = l => l === "a" ? "b" : "a";

/* El daño: lo que pega el golpe, por lo que pega el que pega, dividido por
   lo que aguanta el que recibe, con un ±15% de azar. Con dos parejos y el
   golpe seco son unos 22 de daño contra 120 de vida: seis golpes. */
function calcularDanio(quien, contra, golpe){
  const base = golpe.poder * quien.ataque * quien.mods.ataque /
               (contra.defensa * contra.mods.defensa * contra.guardia);
  return Math.max(1, Math.round(base * (0.85 + AZAR()*0.30)));
}
/* Acertar: lo que acierta el golpe, por lo que ve el que pega, menos lo que
   esquiva el que recibe. El Ojo de halcón se saltea toda la cuenta. */
function acierta(quien, contra, golpe){
  if(quien.noFalla > 0) return true;
  const p = golpe.punteria * quien.mods.punteria - contra.mods.evasion;
  return AZAR() < Math.max(.15, Math.min(1, p));
}

/* Lo que se va cuando el peleador sale a la banca: los estados y todo lo que
   se había puesto encima. La confusión y el enamoramiento se cortan
   cambiando —está dicho en el poder— y los enviones no se guardan para la
   próxima entrada. El sueño no: es el costo del Desmayo y se paga. */
function limpiarAlSalir(p){
  p.confundido = false; p.enamorado = false; p.noFalla = 0;
  p.mods = {ataque:1, defensa:1, velocidad:1, punteria:1, evasion:0, auraExtra:0};
}

/* Una acción es {t:"golpe", id} · {t:"concentrar"} · {t:"cambiar", i}.
   Devuelve la lista de cosas que pasaron, que la pantalla después actúa. */
function aplicarAccion(est, lado, acc, ev){
  const yo = activo(est, lado), rival = activo(est, otroLado(lado));
  if(yo.caido) return;

  if(acc.t === "cambiar"){
    limpiarAlSalir(yo);
    est[lado].i = acc.i;
    ev.push({t:"dice", txt:"¡" + yo.n + ", volvé! Entra " + est[lado].equipo[acc.i].n + "."});
    ev.push({t:"entra", lado});
    return;
  }

  /* ---- los estados, antes de cualquier otra cosa ---- */
  if(yo.dormido > 0){
    yo.dormido--;
    ev.push({t:"dice", txt:yo.n + (yo.dormido ? " sigue dormido." : " se despierta, pero ya es tarde por esta ronda.")});
    return;
  }
  if(yo.enamorado){
    if(AZAR() < .33){
      yo.enamorado = false;
      ev.push({t:"dice", txt:yo.n + " reacciona y se le pasa."});
    }else{
      ev.push({t:"dice", txt:yo.n + " está embobado y no ataca."});
      return;
    }
  }
  if(yo.confundido){
    if(AZAR() < .33){
      yo.confundido = false;
      ev.push({t:"dice", txt:yo.n + " se acomoda la cabeza: se le fue la confusión."});
    }else if(AZAR() < .40){
      const d = Math.max(1, Math.round(yo.vidaMax * .07));
      yo.vida = Math.max(0, yo.vida - d);
      ev.push({t:"pega", lado:otroLado(lado), cant:d,
               txt:yo.n + " está confundido y se pega solo. " + d + " de daño."});
      if(yo.vida <= 0){
        yo.caido = true;
        ev.push({t:"cae", lado, txt:yo.n + " no va más."});
      }
      return;
    }
  }

  if(acc.t === "poder"){
    const pod = yo.poderes[acc.i];
    if(!pod || yo.aura < pod.cuesta){
      ev.push({t:"dice", txt:yo.n + " no tiene aura para eso."});
      return;
    }
    yo.aura -= pod.cuesta;
    pod.hace(yo, rival);
    ev.push({t:"poder", lado, txt:pod.txt(yo, rival)});
    if(rival.vida <= 0 && !rival.caido){
      rival.caido = true;
      ev.push({t:"cae", lado:otroLado(lado), txt:rival.n + " no va más."});
    }
    return;
  }

  if(acc.t === "concentrar"){
    yo.aura = Math.min(yo.auraMax, yo.aura + CONCENTRAR.aura);
    yo.guardia = CONCENTRAR.guardia;
    ev.push({t:"dice", txt:yo.n + " se concentra: junta aura y se cubre."});
    ev.push({t:"aura", lado});
    return;
  }
  const golpe = golpeDe(acc.id);
  if(!acierta(yo, rival, golpe)){
    yo.aura = Math.min(yo.auraMax, yo.aura + 2);
    ev.push({t:"dice", txt:yo.n + " tira una " + golpe.n.toLowerCase() + " y no le da."});
    ev.push({t:"falla", lado});
    return;
  }
  const d = calcularDanio(yo, rival, golpe);
  rival.vida = Math.max(0, rival.vida - d);
  yo.aura = Math.min(yo.auraMax, yo.aura + golpe.aura);
  if(golpe.roba){
    const roba = Math.min(golpe.roba, rival.aura);
    rival.aura -= roba; yo.aura = Math.min(yo.auraMax, yo.aura + roba);
  }
  /* la bronca: al que le pegan junta algo de aura. Sin esto, el que va
     perdiendo pierde también la carrera del aura y no vuelve nunca. */
  rival.aura = Math.min(rival.auraMax, rival.aura + 4);
  ev.push({t:"pega", lado, cant:d, golpe:golpe.id,
           txt:yo.n + " le mete " + golpe.n.toLowerCase() + ". " + d + " de daño."});
  if(rival.vida <= 0){
    rival.caido = true;
    ev.push({t:"cae", lado:otroLado(lado), txt:rival.n + " no va más."});
  }
}

function resolverRonda(est, accA, accB){
  const ev = [];
  const a = activo(est, "a"), b = activo(est, "b");
  a.guardia = 1; b.guardia = 1;

  /* Los cambios van siempre antes que los golpes, y entre dos golpes manda la
     velocidad. Empate: lo tira el azar, que es lo que hace el juego de mesa. */
  const orden = [];
  if(accA.t === "cambiar") orden.push("a");
  if(accB.t === "cambiar") orden.push("b");
  const quedan = ["a","b"].filter(l => !orden.includes(l));
  const rapidez = l => { const p = activo(est, l); return p.velocidad * p.mods.velocidad; };
  quedan.sort((x, y) => {
    const d = rapidez(y) - rapidez(x);
    return d !== 0 ? d : (AZAR() < .5 ? -1 : 1);
  });
  orden.push(...quedan);

  for(const l of orden) aplicarAccion(est, l, l === "a" ? accA : accB, ev);

  /* el aura que junta cada uno por el solo hecho de estar peleando */
  for(const l of ["a","b"]){
    const p = activo(est, l);
    if(p.caido) continue;
    p.aura = Math.min(p.auraMax, p.aura + p.auraPorRonda + p.mods.auraExtra);
    if(p.noFalla > 0) p.noFalla--;
  }
  ev.push({t:"aura", lado:"a"}); ev.push({t:"aura", lado:"b"});

  for(const l of ["a","b"]){
    if(!enPie(est[l]).length){ est.fin = otroLado(l); ev.push({t:"fin", gana:est.fin}); }
  }
  if(!est.fin) est.ronda++;
  return ev;
}

/* Cuando cae el que estaba peleando, el que sigue. La máquina manda al que
   más vida le queda; el humano elige. */
function entraSolo(est, lado){
  const vivos = est[lado].equipo.map((p,i) => ({p,i})).filter(o => !o.p.caido);
  if(!vivos.length) return false;
  vivos.sort((x,y) => y.p.vida - x.p.vida);
  est[lado].i = vivos[0].i;
  return true;
}
/* ¿puede hacer algo más que mirar? Sirve para la pantalla y para la máquina */
function puedeElegir(p){ return !p.caido && p.dormido <= 0; }

/* ---------- la máquina ----------
   No hace trampa: ve lo mismo que se ve en pantalla. Si puede cerrar la
   pelea de un golpe lo tira, si está para caer se cambia, si no tiene aura
   junta, y si no, pega. */
function elegirMaquina(est, lado){
  lado = lado || "b";
  const yo = activo(est, lado), vos = activo(est, otroLado(lado));
  const suplentes = est[lado].equipo.map((p,i) => ({p,i})).filter(o => !o.p.caido && o.i !== est[lado].i);

  for(const g of GOLPES){                       // ¿lo cierro de un golpe?
    if(g.punteria >= .9 && calcularDanio(yo, vos, g) >= vos.vida) return {t:"golpe", id:g.id};
  }
  /* los poderes: primero el que cierra la pelea, después el que la salva, y
     recién ahí el que mejora. Los refuerzos se usan dos veces como mucho:
     una tercera no cambia nada por los topes y sería un turno regalado. */
  const puede = yo.poderes.map((p,i) => ({p,i})).filter(o => yo.aura >= o.p.cuesta);
  const deTipo = t => puede.filter(o => o.p.tipo === t);
  for(const o of deTipo("ofensivo")){
    if(o.p.n === "Doxeo" && vos.vida <= 20) return {t:"poder", i:o.i};
    if(o.p.n === "Cabezazo" && vos.vida <= 25) return {t:"poder", i:o.i};
  }
  if(yo.vida < yo.vidaMax*0.45 && deTipo("cura").length) return {t:"poder", i:deTipo("cura")[0].i};
  if(yo.usados === undefined) yo.usados = 0;
  if(yo.usados < 2 && AZAR() < .5){
    const buenos = deTipo("estorbo").concat(deTipo("refuerzo"), deTipo("ofensivo"));
    if(buenos.length){ yo.usados++; return {t:"poder", i:buenos[(AZAR()*buenos.length)|0].i}; }
  }
  if(yo.vida < yo.vidaMax*0.22 && suplentes.length && AZAR() < .55){
    suplentes.sort((x,y) => y.p.vida - x.p.vida);
    return {t:"cambiar", i:suplentes[0].i};
  }
  if(yo.aura < 30 && yo.vida > yo.vidaMax*0.55 && AZAR() < .35) return {t:"concentrar"};
  const r = AZAR();
  if(r < .52) return {t:"golpe", id:"seco"};
  if(r < .84) return {t:"golpe", id:"volada"};
  return {t:"golpe", id:"chupar"};
}

/* =====================================================================
   LA PANTALLA
   ===================================================================== */
let EST = null;
const fx = {a:{lanza:0, sacude:0}, b:{lanza:0, sacude:0}};
const parpadeo = {a:0, b:0};

function miLook(){ return EST ? activo(EST,"a").look : CREW.tomy; }
function suLook(){ return EST ? activo(EST,"b").look : OTROS.otro1; }
function cayo(lado){ return !!(EST && activo(EST, lado).caido); }

let t0 = performance.now(), ultimo = t0;
function frame(now){
  const dt = Math.min(64, now - ultimo); ultimo = now;
  const t = now - t0;
  medirSiHaceFalta();
  ctx.clearRect(0, 0, ancho, alto);
  if(fondo) ctx.drawImage(fondo, 0, 0);

  const p = puestos();
  const bobR = Math.sin(t/900)*0.9, bobM = Math.sin(t/900 + 2.1)*0.9;
  if(t > parpadeo.b) parpadeo.b = t + 2200 + Math.random()*3600;
  const parpR = parpadeo.b - t < 160;

  for(const l of ["a","b"]){                 // se van apagando solas
    fx[l].lanza  = Math.max(0, fx[l].lanza  - dt/170);
    fx[l].sacude = Math.max(0, fx[l].sacude - dt/260);
  }
  /* el envión al pegar: se tira para adelante y vuelve. El que recibe
     tiembla. Es lo mínimo para que un golpe se vea como un golpe. */
  const envion = l => Math.sin(fx[l].lanza*Math.PI) * 14 * (l === "a" ? 1 : -1);
  const tiembla = l => fx[l].sacude > 0 ? Math.sin(fx[l].sacude*34)*5*fx[l].sacude : 0;

  tarima(ctx, p.rival.x, p.rival.y, p.rival.u*34, "#E86B5E");
  ctx.save();
  ctx.translate(p.rival.x + envion("b")*0.7 + tiembla("b"), p.rival.y - envion("b")*0.25);
  ctx.scale(p.rival.u, p.rival.u);
  dibujarPersona(ctx, suLook(), {bob:bobR, parp:parpR, caido:cayo("b")}); ctx.restore();

  tarima(ctx, p.mio.x, p.mio.y, p.mio.u*34, "#7FB6A4");
  ctx.save();
  ctx.translate(p.mio.x + envion("a") + tiembla("a"), p.mio.y - envion("a")*0.2);
  ctx.scale(p.mio.u, p.mio.u);
  dibujarPersona(ctx, miLook(), {bob:bobM, espalda:true, caido:cayo("a")}); ctx.restore();

  dibujarMotas(ctx, dt);
  requestAnimationFrame(frame);
}

const $ = id => document.getElementById(id);

function placa(id, p){
  const el = $(id);
  const pv = Math.max(0, p.vida/p.vidaMax);
  el.classList.toggle("poca", pv <= .5 && pv > .2);
  el.classList.toggle("nada", pv <= .2);
  el.querySelector(".nom").textContent = p.n;
  /* Lo que le está pasando encima. Sin esto, «no ataca» o «se pega solo»
     parecen errores del juego en vez de un estado que le pusieron. */
  const marcas = [];
  if(p.dormido > 0)  marcas.push("dormido " + p.dormido);
  if(p.confundido)   marcas.push("confundido");
  if(p.enamorado)    marcas.push("enamorado");
  if(p.noFalla > 0)  marcas.push("no falla " + p.noFalla);
  if(p.mods.evasion > 0)   marcas.push("+esquiva");
  if(p.mods.ataque > 1)    marcas.push("+ataque");
  if(p.mods.velocidad > 1) marcas.push("+veloz");
  if(p.mods.punteria < 1)  marcas.push("-puntería");
  if(p.mods.auraExtra > 0) marcas.push("+aura");
  /* dos y no más: con tres, el nombre se empezaba a cortar y el nombre
     importa más que el tercer estado */
  const chapa = el.querySelector(".estado");
  if(chapa) chapa.textContent = marcas.slice(0,2).join(" · ") + (marcas.length > 2 ? " +" + (marcas.length-2) : "");
  el.querySelector(".vida i").style.width = (pv*100).toFixed(1)+"%";
  el.querySelector(".aura i").style.width = ((p.aura/p.auraMax)*100).toFixed(1)+"%";
  const c = el.querySelectorAll(".cifras b");
  c[0].textContent = p.vida + "/" + p.vidaMax;
  c[1].textContent = Math.round(p.aura) + "/" + p.auraMax;
}
function marcador(id, lado){
  $(id).innerHTML = lado.equipo.map(p => '<i class="' + (p.caido ? "ido" : "") + '"></i>').join("");
}
function pintar(){
  if(!EST) return;
  placa("placaRival", activo(EST,"b"));
  placa("placaMio",   activo(EST,"a"));
  marcador("tuyos", EST.a); marcador("suyos", EST.b);
  $("ronda").textContent = EST.fin ? "Se terminó" : "Ronda " + EST.ronda;
}
function decir(txt){ $("dialogo").innerHTML = txt; }

/* ---------- los menús ---------- */
function botonesArriba(prendidos){
  for(const id of ["optPelear","optPoder","optMochila","optCambiar"]) $(id).disabled = !prendidos;
  $("optMochila").disabled = true;                 // todavía no hay mochila
  if(prendidos && EST){
    /* el del poder se apaga solo cuando no alcanza el aura para ninguno: es
       la forma de que se vea para qué sirve juntarla */
    const yo = activo(EST,"a");
    const alcanza = yo.poderes.some(p => yo.aura >= p.cuesta);
    $("optPoder").disabled = !alcanza;
    $("optPoder").innerHTML = yo.poderes.length
      ? "Poder" + (alcanza ? "" : '<small>falta aura</small>')
      : "Poder";
  }
}
function cerrarSub(){
  $("submenu").hidden = true; $("submenu").innerHTML = "";
  $("menu").hidden = false;
}
function abrirSub(opciones){
  const sm = $("submenu");
  sm.innerHTML = "";
  for(const o of opciones){
    const b = document.createElement("button");
    b.className = "opt" + (o.volver ? " volver" : "");
    b.innerHTML = o.n + (o.pie ? '<small class="' + (o.aura ? "a" : "") + '">' + o.pie + "</small>" : "");
    b.disabled = !!o.no;
    b.addEventListener("click", o.hace);
    sm.appendChild(b);
  }
  sm.hidden = false;
  $("menu").hidden = true;             // ocho botones no entran en un teléfono
}

let esperando = false;                    // mientras se cuenta lo que pasó, no se toca nada
function pedirAccion(){
  if(EST.fin) return;
  esperando = false;
  /* Dormido no elige nada: la ronda se resuelve sola y sólo se cuenta qué
     pasó. Si se pidiera acción igual, el juego quedaría esperando un toque
     que no cambia nada. */
  if(!puedeElegir(activo(EST,"a"))){
    botonesArriba(false); cerrarSub();
    decir("<em>" + activo(EST,"a").n + "</em> está dormido.");
    setTimeout(() => jugar({t:"dormido"}), 800);
    return;
  }
  botonesArriba(true); cerrarSub();
  decir("¿Qué hace <em>" + activo(EST,"a").n + "</em>?");
}

function menuGolpes(){
  const yo = activo(EST,"a");
  abrirSub(GOLPES.map(g => ({n:g.n, pie:g.pie, hace:() => jugar({t:"golpe", id:g.id})}))
    .concat([{n:CONCENTRAR.n, pie:CONCENTRAR.pie, aura:true, hace:() => jugar({t:"concentrar"})}]));
}
function menuPoderes(){
  const yo = activo(EST,"a");
  const ops = yo.poderes.map((p,i) => ({
    n:p.n, pie:p.cuesta + " aura · " + p.pie, aura:true,
    no: yo.aura < p.cuesta,
    hace: () => jugar({t:"poder", i})
  }));
  if(!ops.length) ops.push({n:"Sin poder", pie:"todavía no tiene", no:true, hace:()=>{}});
  ops.push({n:"Volver", volver:true, hace:pedirAccion});
  abrirSub(ops);
}

function menuCambiar(obligado){
  const ops = EST.a.equipo.map((p,i) => ({
    n:p.n, pie:p.caido ? "no va más" : p.vida + "/" + p.vidaMax,
    no: p.caido || (!obligado && i === EST.a.i),
    hace: () => obligado ? entraElegido(i) : jugar({t:"cambiar", i})
  }));
  if(!obligado) ops.push({n:"Volver", volver:true, hace:pedirAccion});
  abrirSub(ops);
}

/* ---------- contar lo que pasó ----------
   Los sucesos se muestran de a uno, con una pausa, porque todos juntos no
   se entienden. Tocando la pantalla se apura. */
let cola = [], reloj = null;
function reproducir(ev, alTerminar){
  cola = ev.slice(); esperando = true;
  botonesArriba(false); cerrarSub();
  const paso = () => {
    if(!cola.length){ reloj = null; pintar(); alTerminar(); return; }
    const e = cola.shift();
    if(e.txt) decir(e.txt);
    if(e.t === "pega"){ fx[e.lado].lanza = 1; fx[otroLado(e.lado)].sacude = 1; }
    if(e.t === "falla") fx[e.lado].lanza = 0.7;
    pintar();
    reloj = setTimeout(paso, e.txt ? 950 : 120);
  };
  paso();
}
function apurar(){
  if(!reloj) return;
  clearTimeout(reloj); reloj = null;
  while(cola.length){
    const e = cola.shift();
    if(e.txt) decir(e.txt);
  }
  pintar();
  if(pendiente){ const f = pendiente; pendiente = null; f(); }
}
let pendiente = null;

function jugar(accion){
  if(esperando && accion.t !== "dormido") return;
  const ev = resolverRonda(EST, accion, elegirMaquina(EST));
  pendiente = despues;
  reproducir(ev, () => { pendiente = null; despues(); });
}

function despues(){
  if(EST.fin){ terminar(); return; }
  /* si cayó alguno, entra el que sigue: la máquina sola, vos eligiendo */
  if(activo(EST,"b").caido) entraSolo(EST, "b");
  if(activo(EST,"a").caido){
    esperando = false; botonesArriba(false);
    decir("Cayó. ¿Quién entra?");
    menuCambiar(true);
    return;
  }
  pintar(); pedirAccion();
}
function entraElegido(i){
  EST.a.i = i; cerrarSub(); pintar();
  decir("Entra <em>" + activo(EST,"a").n + "</em>.");
  setTimeout(pedirAccion, 600);
}

function terminar(){
  botonesArriba(false); cerrarSub(); pintar();
  const gane = EST.fin === "a";
  decir(gane ? "<em>Ganaste.</em> Los tres de ellos abajo."
             : "<em>Perdiste.</em> Se te cayeron los tres.");
  abrirSub([{n:"Otra", pie:"elegir equipo de nuevo", hace:volverAElegir}]);
}
function volverAElegir(){
  EST = null; elegidos = [];
  $("pBatalla").hidden = true; $("pEquipo").hidden = false;
  $("ronda").textContent = "Elegí tu equipo";
  $("tuyos").innerHTML = ""; $("suyos").innerHTML = "";
  pintarFichas();
}

/* ---------- elegir equipo ---------- */
let elegidos = [];
/* El retrato de la ficha: la persona entera, de la punta del pelo a la
   sombra de los pies. Antes entraba a lo bruto y quedaba cortada por la
   cadera, y a los más altos les comía la cabeza.

   La cuenta sale de las medidas de dibujarPersona: la punta del pelo llega
   a -104 y la sombra a +10, y a los altos el escalado vertical los estira,
   así que el alto de cada uno depende de su `tall`. */
const RET_ANCHO = 72, RET_ALTO = 92;
function retrato(cv2, look){
  const g = cv2.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv2.width = RET_ANCHO*dpr; cv2.height = RET_ALTO*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,RET_ANCHO,RET_ALTO);
  const arriba = 104 * (look.tall || 1), abajo = 10;
  const esc = RET_ALTO / (arriba + abajo);
  g.save();
  g.translate(RET_ANCHO/2, arriba*esc);
  g.scale(esc, esc);
  dibujarPersona(g, look, {bob:0});
  g.restore();
}
function pintarFichas(){
  const cont = $("fichas");
  if(!cont) return;
  cont.innerHTML = "";
  for(const clave of Object.keys(CREW)){
    const look = CREW[clave], p = PERFILES[clave] || {};
    const b = document.createElement("button");
    b.className = "ficha" + (elegidos.includes(clave) ? " elegida" : "");

    /* Cada pedazo se arma y se cuelga por separado, y el dibujo va al final
       y aparte. Antes era un innerHTML con el canvas adentro y el retrato
       pegado: si cualquiera de esas cosas fallaba —y en algún teléfono
       falló— no quedaba ni una ficha y la pantalla se veía vacía. Así, lo
       peor que puede pasar es que a una le falte el dibujo. */
    const lienzo = document.createElement("canvas");
    lienzo.width = RET_ANCHO; lienzo.height = RET_ALTO;
    b.appendChild(lienzo);
    const nom = document.createElement("b");
    nom.textContent = look.n;
    b.appendChild(nom);
    const l1 = document.createElement("small");
    l1.textContent = (p.v || "?") + " vida · " + (p.at || "?") + " ata";
    b.appendChild(l1);
    const l2 = document.createElement("small");
    l2.textContent = (p.df || "?") + " def · " + (p.vel || "?") + " vel";
    b.appendChild(l2);

    b.addEventListener("click", () => {
      const i = elegidos.indexOf(clave);
      if(i >= 0) elegidos.splice(i,1);
      else if(elegidos.length < 3) elegidos.push(clave);
      pintarFichas();
    });
    cont.appendChild(b);
    try{ retrato(lienzo, look); }catch(e){ lienzo.style.display = "none"; }
  }
  const listo = elegidos.length === 3;
  $("btnEmpezar").disabled = !listo;
  $("btnEmpezar").textContent = listo ? "Empezar" : "Elegí tres (" + elegidos.length + "/3)";
}

function empezar(){
  /* el otro equipo saca tres al azar de los nueve */
  const suyos = Object.keys(OTROS).slice();
  for(let i = suyos.length-1; i > 0; i--){
    const j = (AZAR()*(i+1))|0; const x = suyos[i]; suyos[i] = suyos[j]; suyos[j] = x;
  }
  EST = nuevaBatalla(elegidos, suyos.slice(0,3));
  $("pEquipo").hidden = true; $("pBatalla").hidden = false;
  medirSiHaceFalta(); pintar();
  decir("Enfrente: <em>" + activo(EST,"b").n + "</em>. Arrancás vos.");
  setTimeout(pedirAccion, 900);
}

/* ---------- si se rompe, que se vea ----------
   Un error suelto deja la pantalla vacía y en el teléfono no hay consola
   para enterarse. Esto lo escribe arriba de todo, que es la única forma de
   que el que está jugando lo pueda contar. */
function avisarDelError(txt){
  const p = document.querySelector(".intro");
  if(p){ p.innerHTML = "<b>Se rompió algo:</b> " + txt; p.style.color = "#E86B5E"; }
}
if(typeof window !== "undefined" && window.addEventListener){
  window.addEventListener("error", ev => {
    avisarDelError((ev.message || "error") + " · línea " + (ev.lineno || "?"));
  });
}

if(typeof document !== "undefined" && document.getElementById){
 try{
  $("optPelear").addEventListener("click", menuGolpes);
  $("optCambiar").addEventListener("click", () => menuCambiar(false));
  $("optPoder").addEventListener("click", menuPoderes);
  $("optMochila").addEventListener("click", () => decir("La mochila es lo que sigue."));
  /* el botón del poder se prende y apaga solo según el aura: lo hace botonesArriba */
  $("optMochila").disabled = true;
  $("btnEmpezar").addEventListener("click", empezar);
  $("escena").addEventListener("pointerdown", apurar);
  pintarFichas();
  medir();
  requestAnimationFrame(frame);
 }catch(e){
  avisarDelError((e && e.message ? e.message : e) + "");
  /* aunque se haya roto el resto, que la lista esté: es lo único que hace
     falta para empezar a jugar */
  try{ pintarFichas(); }catch(e2){}
 }
}

/* ---------- ¿quedó vieja esta copia? ----------
   Lo mismo que hace index.html, con su propio archivo de versión. La
   escribe scripts/sellar.js: no se toca a mano.
       node scripts/sellar.js batalla.html                                */
const VERSION = "450b98af24";
(function mirarSiHayNueva(){
  if(typeof window === "undefined" || !window.fetch) return;
  if(!/^https?:/.test(location.protocol || "")) return;
  let yaRecargue = false;
  try{ yaRecargue = sessionStorage.getItem("aura.recarga") === VERSION; }catch(e){}
  if(yaRecargue) return;
  fetch("version-batalla.txt?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(t => {
      const nueva = (t || "").trim();
      if(!nueva || nueva === VERSION) return;
      try{ sessionStorage.setItem("aura.recarga", nueva); }catch(e){}
      location.replace(location.pathname + "?v=" + encodeURIComponent(nueva));
    })
    .catch(() => {});
})();
