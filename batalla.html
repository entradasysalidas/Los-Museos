<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los Museos: Aura</title>
<link rel="icon" href="caja.jpg">
<link rel="apple-touch-icon" href="caja.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0E1014">
<meta name="description" content="Dos equipos, tres contra tres. Cada uno con su poder y su aura.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* La paleta es la de Los Museos de noche. El aura es el color nuevo: no lo
     usa ninguna otra cosa del juego, para que se lea de un vistazo. */
  :root{
    --bg:#0E1014; --panel:#171A21; --panel2:#1F232C; --sunk:#0A0C10;
    --line:#2A2F3A; --hair:#39404E;
    --ink:#F2F1ED; --body:#C8CBD3; --dim:#8B909C;
    --brass:#D9A94F; --brass-dim:#8A6B31;
    --alarm:#E86B5E; --patina:#7FB6A4; --aura:#A98CF0;
    --shadow:0 18px 44px #000a;
  }
  *{box-sizing:border-box}
  canvas,.opt,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--body);
    font:16px/1.5 "Archivo","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  #app{height:100%;max-width:820px;margin:0 auto;padding:10px 12px 12px;
    display:flex;flex-direction:column;gap:10px}

  /* ---------- el encabezado: quién contra quién ---------- */
  header{display:flex;align-items:baseline;gap:10px;flex:none}
  header b{font:400 17px/1 "Archivo Black","Archivo",sans-serif;color:var(--ink);
    letter-spacing:-.02em}
  header small{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}

  /* ---------- la escena ----------
     El lienzo dibuja el salón y los dos que pelean. Las placas van en HTML
     encima: el texto chico en canvas se ve sucio en el teléfono. */
  #escena{position:relative;flex:1 1 auto;min-height:0;
    background:linear-gradient(#12151C,#0A0C10);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:var(--shadow)}
  #c{display:block;width:100%;height:100%}

  .placa{position:absolute;min-width:min(52%,240px);padding:8px 10px 9px;
    background:#0F1218E6;border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(2px)}
  .placa.rival{left:10px;top:10px}
  .placa.mio{right:10px;bottom:10px}
  .placa .fila{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .placa .nom{font:400 14px/1 "Archivo Black","Archivo",sans-serif;color:var(--ink);
    letter-spacing:-.01em}
  .placa .eq{font:500 8px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);margin-left:auto}

  /* las dos barras: la vida arriba, el aura abajo y más fina */
  .barra{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;
    border:1px solid #00000060}
  .barra + .barra{margin-top:5px;height:5px}
  .barra i{display:block;height:100%;border-radius:4px;
    transition:width .35s ease}
  .vida i{background:var(--patina)}
  .placa.poca .vida i{background:var(--brass)}
  .placa.nada .vida i{background:var(--alarm)}
  .aura i{background:var(--aura);box-shadow:0 0 8px #A98CF080}
  .cifras{display:flex;gap:10px;margin-top:6px;
    font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--dim)}
  .cifras b{color:var(--body);font-weight:500}
  .cifras .a{color:var(--aura)}

  /* ---------- el cajón de abajo: lo que se dice y lo que se elige ---------- */
  #dialogo{flex:none;min-height:56px;padding:11px 13px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:15px}
  #dialogo em{color:var(--brass);font-style:normal;font-weight:600}

  #menu{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .opt{appearance:none;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);border-radius:11px;padding:13px 10px;cursor:pointer;
    font:600 13px/1 "Archivo",sans-serif;letter-spacing:.06em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .08s,border-color .15s,background .15s}
  .opt:active{transform:translateY(1px)}
  .opt .costo{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;
    text-transform:none;color:var(--aura)}
  .opt[disabled]{opacity:.42;cursor:default}
  @media(hover:hover){ .opt:not([disabled]):hover{border-color:var(--brass-dim);background:#242935} }

  /* En pantalla ancha el menú entra en una sola fila y la escena respira. */
  @media(min-width:640px){ #menu{grid-template-columns:repeat(4,1fr)} }
  /* Apaisado en el teléfono: la escena se achica antes que el menú. */
  @media(max-height:520px){ #dialogo{min-height:0;padding:8px 11px;font-size:14px}
    .opt{padding:10px 8px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Los Museos: Aura</b>
    <small id="ronda">Ronda 1</small>
  </header>

  <div id="escena">
    <canvas id="c"></canvas>
    <div class="placa rival" id="placaRival">
      <div class="fila"><span class="nom">—</span><span class="eq">Rival</span></div>
      <div class="barra vida"><i style="width:100%"></i></div>
      <div class="barra aura"><i style="width:0%"></i></div>
      <div class="cifras"><span><b>—</b> vida</span><span class="a"><b>—</b> aura</span></div>
    </div>
    <div class="placa mio" id="placaMio">
      <div class="fila"><span class="nom">—</span><span class="eq">Vos</span></div>
      <div class="barra vida"><i style="width:100%"></i></div>
      <div class="barra aura"><i style="width:0%"></i></div>
      <div class="cifras"><span><b>—</b> vida</span><span class="a"><b>—</b> aura</span></div>
    </div>
  </div>

  <div id="dialogo">—</div>

  <div id="menu">
    <button class="opt" id="optPelear">Pelear</button>
    <button class="opt" id="optPoder">Poder</button>
    <button class="opt" id="optMochila">Mochila</button>
    <button class="opt" id="optCambiar">Cambiar</button>
  </div>
</div>

<script>
/* =====================================================================
   Los Museos: Aura · dos equipos, tres contra tres.

   Juego aparte del de sigilo. index.html no se toca y este archivo no lo
   lee: lo que comparten son los personajes y la forma de dibujarlos, que
   están COPIADOS acá abajo a propósito.

   Si alguna vez cambia el dibujo de la gente en index.html, este archivo
   queda viejo y hay que volver a copiarlo a mano. Es a propósito: un
   script que regenere este archivo desde el otro es justo lo que ya
   borró trabajo una vez. index.html siempre manda.
   ===================================================================== */

/* ---------- el grupo del museo ----------
   Copiado de index.html tal cual. Son los mismos diez de siempre. */
const CREW = {
  tomy  :{n:"Tomy",      hair:"#C2571F", style:"rulos",      beard:false, tall:1.00, shirt:"#4E8FD0"},
  lamber:{n:"Lamber",    hair:"#1E1A18", style:"corto",      beard:true,  tall:1.00, shirt:"#57A06B"},
  chupa :{n:"Chupa",     hair:"#1E1A18", style:"corto",      beard:false, tall:1.00, shirt:"#C9603F"},
  kzk   :{n:"Kzk",       hair:"#A9793F", style:"corto",      beard:true,  tall:1.00, shirt:"#8A6BC4"},
  matxi :{n:"Matxi",     hair:"#6B4526", style:"corto",      beard:false, tall:1.00, shirt:"#D8A33C"},
  chuna :{n:"Chuna",     hair:"#3A2416", style:"largorulos", beard:false, tall:1.00, shirt:"#3FA6A0"},
  hippie:{n:"El Hippie", hair:"#1E1A18", style:"corto",      beard:false, tall:1.18, shirt:"#22242A"},
  marian:{n:"Marian",    hair:"#7A5230", style:"largo",      beard:false, tall:1.10, shirt:"#5B7FD4"},
  damian:{n:"Damián",    hair:"#1E1A18", style:"medio",      beard:false, tall:1.00, shirt:"#7FA23E"},
  negro :{n:"El Negro",  hair:"#2A1D14", style:"corto",      beard:true,  tall:1.00, shirt:"#6B4A2F", skin:"#8A5A38"},
};
Object.values(CREW).forEach(c => { c.tag = c.n.replace(/^El /,"").toUpperCase(); });

/* ---------- el otro equipo ----------
   Los nueve todavía no tienen nombre: los pone el autor. Mientras tanto
   quedan las pintas armadas, para que la pantalla se pueda mirar. En
   cuanto lleguen los nombres, esto se reemplaza y nada más que esto. */
const OTROS = {
  otro1:{n:"Sin nombre 1", hair:"#3A2416", style:"medio",      beard:false, tall:1.00, shirt:"#C4506B"},
  otro2:{n:"Sin nombre 2", hair:"#1E1A18", style:"corto",      beard:true,  tall:1.06, shirt:"#3E7FA0"},
  otro3:{n:"Sin nombre 3", hair:"#A9793F", style:"largo",      beard:false, tall:1.00, shirt:"#6BA04F"},
  otro4:{n:"Sin nombre 4", hair:"#C2571F", style:"corto",      beard:false, tall:1.00, shirt:"#8A5AB8"},
  otro5:{n:"Sin nombre 5", hair:"#2A1D14", style:"largorulos", beard:false, tall:1.00, shirt:"#D8B33C", skin:"#8A5A38"},
  otro6:{n:"Sin nombre 6", hair:"#6B4526", style:"rulos",      beard:true,  tall:1.00, shirt:"#4E5A70"},
  otro7:{n:"Sin nombre 7", hair:"#1E1A18", style:"corto",      beard:false, tall:1.14, shirt:"#B8563E"},
  otro8:{n:"Sin nombre 8", hair:"#7A5230", style:"medio",      beard:false, tall:1.00, shirt:"#2FA88C"},
  otro9:{n:"Sin nombre 9", hair:"#1E1A18", style:"corto",      beard:true,  tall:1.00, shirt:"#A0863E"},
};
Object.values(OTROS).forEach(c => { c.tag = c.n.replace(/^El /,"").toUpperCase(); });

/* Los dieciocho juntos, para buscar a cualquiera por su clave. */
const GENTE = Object.assign({}, CREW, OTROS);

/* ---------- el dibujo de la gente ----------
   Copiado de index.html y podado: allá el mismo cuerpo se pone traje de
   astronauta, campera de nieve, malla y disfraces, porque hay siete
   ediciones. Acá no hay ediciones: queda el cuerpo pelado, con la misma
   silueta y las mismas medidas, para que se reconozcan igual.

   Las medidas del original: el torso mide 19 de ancho, la cara es un
   círculo de radio 8 centrado en -14.5, y los pies apoyan en 15. */
const rr = (g,x,y,w,h,r) => { g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };

/* ¿la remera es oscura? decide si el nombre estampado va en claro o en oscuro */
function isDark(hex){
  const n = parseInt(hex.slice(1),16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) < 140;
}
function hexA(hex,a){
  const n = parseInt((hex||"#D9A94F").slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a.toFixed(2)+")";
}

function drawHairBack(g, look, bob){
  const y = -14.5+bob;
  g.fillStyle = look.hair;
  if(look.style === "largo"){
    g.beginPath(); g.arc(0,y-1,9.4,0,7); g.fill();
    g.fillRect(-9.4,y-1,18.8,10);
    g.beginPath(); g.arc(0,y+9,9.4,0,Math.PI); g.fill();
  }else if(look.style === "largorulos"){
    for(const [cx,cy,r] of [[-8,y+1,5.2],[8,y+1,5.2],[-8.5,y+6,4.8],[8.5,y+6,4.8],[0,y+9,5.2]]){
      g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    }
  }else if(look.style === "medio"){
    g.beginPath(); g.arc(0,y-1,9.1,0,7); g.fill();
    g.fillRect(-9.1,y-1,18.2,7);
  }
}

function drawHair(g, look, bob){
  const y = -14.5+bob;
  g.fillStyle = look.hair;
  if(look.style === "corto"){
    g.beginPath(); g.arc(0,y-1,8.9,Math.PI*1.02,Math.PI*1.98); g.fill();
    g.fillRect(-8.9,y-3.5,17.8,4);
    g.fillRect(-8.9,y-3,2.6,6);  g.fillRect(6.3,y-3,2.6,6);        // patillas
  }else if(look.style === "medio"){
    g.beginPath(); g.arc(0,y-1.5,8.6,Math.PI,0); g.fill();
    g.fillRect(-8.6,y-2.5,17.2,4);
    g.fillRect(-8.6,y-2,2.8,8);  g.fillRect(5.8,y-2,2.8,8);
  }else if(look.style === "largo"){
    g.beginPath(); g.arc(0,y-1.5,8.8,Math.PI,0); g.fill();
    g.fillRect(-8.8,y-2.5,17.6,4);
    g.fillRect(-8.8,y-2,2.9,13); g.fillRect(5.9,y-2,2.9,13);       // mechones al costado
  }else if(look.style === "rulos"){
    for(const [cx,cy,r] of [[-6,y-4,4.2],[0,y-6.5,4.6],[6,y-4,4.2],[-8,y-.5,3.6],[8,y-.5,3.6]]){
      g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    }
  }else if(look.style === "largorulos"){
    for(const [cx,cy,r] of [[-6,y-4,4.4],[0,y-6.8,4.8],[6,y-4,4.4],
                            [-9,y+2,4.2],[9,y+2,4.2],[-8,y+8,4],[8,y+8,4],[0,y+11,4.4]]){
      g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    }
  }
}

function drawPerson(g, look, bob, alpha){
  const t = look.tall || 1;
  g.save();
  if(alpha !== undefined) g.globalAlpha = alpha;
  g.scale(1, t);
  g.fillStyle = "#00000038"; g.beginPath(); g.ellipse(0,15,11,4.5,0,0,7); g.fill();
  const piel = look.skin || "#EFC08C";
  g.fillStyle = "#2B3140"; g.fillRect(-6.5,4,5,11); g.fillRect(1.5,4,5,11);    // piernas
  drawHairBack(g, look, bob);                                                  // melena, detrás de todo
  g.fillStyle = look.shirt; rr(g,-9.5,-8+bob,19,15,5); g.fill();               // remera
  g.fillStyle = "#00000022"; rr(g,-9.5,-8+bob,19,4,4); g.fill();
  if(look.tag){                                                                // nombre estampado
    g.save();
    /* la remera mide 19 de ancho y el nombre tiene que entrar adentro: si es
       largo, achica la letra en vez de irse de la tela. En el otro juego no
       hacía falta porque los diez tienen nombre corto. */
    g.font = '700 5.2px "Archivo",system-ui,sans-serif';
    const ancho0 = g.measureText(look.tag).width;
    if(ancho0 > 16) g.font = '700 ' + (5.2*16/ancho0).toFixed(2) + 'px "Archivo",system-ui,sans-serif';
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = isDark(look.shirt) ? "#EFEDE7" : "#1B1D22";
    g.fillText(look.tag, 0, -0.5+bob);
    g.restore();
  }
  g.fillStyle = piel; g.fillRect(-12.5,-5+bob,3.6,10); g.fillRect(8.9,-5+bob,3.6,10);
  g.beginPath(); g.arc(0,-14.5+bob,8,0,7); g.fill();                           // cara
  drawHair(g, look, bob);
  if(look.beard){
    g.fillStyle = look.hair;
    g.beginPath(); g.arc(0,-11.5+bob,6.6,.15*Math.PI,.85*Math.PI); g.fill();
  }
  g.fillStyle = "#1C1F26";
  g.beginPath(); g.arc(-2.9,-14.8+bob,1.15,0,7); g.fill();
  g.beginPath(); g.arc(2.9,-14.8+bob,1.15,0,7); g.fill();
  g.globalAlpha = 1;
  g.restore();
}

/* ---------- la escena ----------
   Un salón vacío de museo: piso, pared del fondo y dos tarimas. El que
   juega abajo a la izquierda y más grande; el rival arriba a la derecha
   y más chico, que es lo que da la profundidad. */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let ancho = 0, alto = 0;

function medir(){
  const caja = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  ancho = Math.max(1, Math.round(caja.width));
  alto  = Math.max(1, Math.round(caja.height));
  cv.width  = Math.round(ancho * dpr);
  cv.height = Math.round(alto  * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", medir);

/* Dónde va cada uno y de qué tamaño, en función de lo que haya de pantalla.
   La persona mide 30 de alto en sus propias unidades: de -22 (la cabeza) a
   15 (los pies). La escala sale del alto del salón, no del ancho, así en
   apaisado no se desborda. */
const HORIZONTE = 0.44;              // dónde termina la pared y empieza el piso
function puestos(){
  /* El que juega ocupa como un tercio del alto del salón: más chico no se le
     ve la cara, más grande no entra con las placas. El ancho también manda,
     porque apaisado el alto sobra y los dos se pisarían. */
  const u = Math.max(2.2, Math.min(alto/125, ancho/85, 7));
  return {
    /* los dos apoyan por debajo del horizonte, que es lo que los para en el
       piso en vez de dejarlos colgados de la pared */
    rival: {x: ancho*0.74, y: alto*0.58, u: u*0.74},
    mio:   {x: ancho*0.27, y: alto*0.95, u: u},
  };
}

function tarima(g, x, y, radio, color){
  g.save();
  g.fillStyle = hexA(color, .10);
  g.beginPath(); g.ellipse(x, y, radio, radio*0.28, 0, 0, 7); g.fill();
  g.strokeStyle = hexA(color, .34); g.lineWidth = 1.4;
  g.beginPath(); g.ellipse(x, y, radio, radio*0.28, 0, 0, 7); g.stroke();
  g.restore();
}

function salon(g){
  const horizonte = alto*HORIZONTE;
  g.fillStyle = "#13161E"; g.fillRect(0, 0, ancho, horizonte);          // pared del fondo
  const piso = g.createLinearGradient(0, horizonte, 0, alto);
  piso.addColorStop(0, "#1A1E28"); piso.addColorStop(1, "#0C0E14");
  g.fillStyle = piso; g.fillRect(0, horizonte, ancho, alto-horizonte);
  g.strokeStyle = "#2A2F3A"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, horizonte+.5); g.lineTo(ancho, horizonte+.5); g.stroke();

  /* tres cuadros colgados, que es todo lo que hace falta para que se lea
     «museo» sin robarle atención a los que pelean */
  /* En el teléfono son dos: el del medio caía justo detrás de la placa del
     rival y se veía el marco asomando por abajo, que parecía un error. */
  const marcos = ancho < 520 ? [[0.20,0.42],[0.87,0.36]]
                             : [[0.13,0.34],[0.57,0.18],[0.88,0.38]];
  for(const [fx, fh] of marcos){
    const an = Math.max(22, Math.min(ancho*0.085, alto*0.11)), al = an*1.22;
    const x = ancho*fx - an/2, y = horizonte*fh;
    g.fillStyle = "#0A0C10"; g.fillRect(x, y, an, al);
    g.strokeStyle = hexA("#D9A94F", .38); g.lineWidth = 2;
    g.strokeRect(x+1, y+1, an-2, al-2);
    g.fillStyle = hexA("#D9A94F", .05); g.fillRect(x+4, y+4, an-8, al-8);
  }
}

let t0 = performance.now();
function frame(now){
  const t = now - t0;
  medirSiHaceFalta();
  ctx.clearRect(0, 0, ancho, alto);
  salon(ctx);

  const p = puestos();
  const bobR = Math.sin(t/620)*0.55;
  const bobM = Math.sin(t/620 + 1.7)*0.55;

  tarima(ctx, p.rival.x, p.rival.y, p.rival.u*14, "#E86B5E");
  ctx.save(); ctx.translate(p.rival.x, p.rival.y - p.rival.u*15); ctx.scale(p.rival.u, p.rival.u);
  drawPerson(ctx, EN_PANTALLA.rival, bobR); ctx.restore();

  tarima(ctx, p.mio.x, p.mio.y, p.mio.u*14, "#7FB6A4");
  ctx.save(); ctx.translate(p.mio.x, p.mio.y - p.mio.u*15); ctx.scale(p.mio.u, p.mio.u);
  drawPerson(ctx, EN_PANTALLA.mio, bobM); ctx.restore();

  requestAnimationFrame(frame);
}

/* El lienzo se remide sólo cuando de verdad cambió de tamaño: medir en cada
   cuadro fuerza un reflow por cuadro y en el teléfono se nota. */
let ultimo = "";
function medirSiHaceFalta(){
  const caja = cv.parentElement.getBoundingClientRect();
  const clave = Math.round(caja.width)+"x"+Math.round(caja.height)+"@"+(window.devicePixelRatio||1);
  if(clave === ultimo) return;
  ultimo = clave; medir();
}

/* ---------- lo que se ve mientras no hay motor ----------
   La etapa 1 es el esqueleto: se dibuja la pelea, no se pelea. El motor de
   turnos, el aura y los poderes entran en las etapas que siguen. */
const EN_PANTALLA = { mio: CREW.tomy, rival: OTROS.otro1 };

function placa(id, look, vida, vidaMax, aura, auraMax){
  const el = document.getElementById(id);
  const pv = Math.max(0, vida/vidaMax);
  el.classList.toggle("poca", pv <= .5 && pv > .2);
  el.classList.toggle("nada", pv <= .2);
  el.querySelector(".nom").textContent = look.n;
  el.querySelector(".vida i").style.width = (pv*100).toFixed(1)+"%";
  el.querySelector(".aura i").style.width = ((aura/auraMax)*100).toFixed(1)+"%";
  const cifras = el.querySelectorAll(".cifras b");
  cifras[0].textContent = vida + "/" + vidaMax;
  cifras[1].textContent = aura + "/" + auraMax;
}

function pintarTodo(){
  placa("placaRival", EN_PANTALLA.rival, 120, 120, 0, 100);
  placa("placaMio",   EN_PANTALLA.mio,   120, 120, 0, 100);
  document.getElementById("dialogo").innerHTML =
    "Esto es el <em>esqueleto</em>: la escena, las barras y el menú. " +
    "El combate, el aura y los poderes entran en la etapa que sigue.";
  for(const id of ["optPelear","optPoder","optMochila","optCambiar"]){
    document.getElementById(id).disabled = true;
  }
}

/* ---------- ¿quedó vieja esta copia? ----------
   Lo mismo que hace index.html, con su propio archivo de versión: GitHub
   Pages manda diez minutos de caché y agregado a la pantalla de inicio no
   hay botón de recargar. Se pregunta por version-batalla.txt con la hora
   pegada al final, una dirección que nunca estuvo en la caché.

   VERSION la escribe scripts/sellar.js: no se toca a mano.
       node scripts/sellar.js batalla.html                                */
const VERSION = "b5bd08e213";
(function mirarSiHayNueva(){
  if(typeof window === "undefined" || !window.fetch) return;
  if(!/^https?:/.test(location.protocol || "")) return;   // abierto como archivo, o el arnés
  let yaRecargue = false;
  try{ yaRecargue = sessionStorage.getItem("aura.recarga") === VERSION; }catch(e){}
  if(yaRecargue) return;
  fetch("version-batalla.txt?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(t => {
      const nueva = (t || "").trim();
      if(!nueva || nueva === VERSION) return;
      try{ sessionStorage.setItem("aura.recarga", nueva); }catch(e){}
      location.replace(location.pathname + "?v=" + encodeURIComponent(nueva));
    })
    .catch(() => {});                      // sin señal, se juega con lo que hay
})();

medir();
pintarTodo();
requestAnimationFrame(frame);
</script>
